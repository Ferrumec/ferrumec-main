[package]
name = "ferrumec-main"
version = "0.1.1"
edition = "2024"
description = "Rust library for bootstrapping an Actix Web server around Ferrumec modules."
license = "MIT"

[dependencies]
actix-files = "0.6.10"
actix-web = "4.18.1"
ferrumec = { version = "0.5", features = ["web"] }
ferrumec-perms = "0.1.1"
futures-util = "0.3"
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = "0.33.1"
opentelemetry_sdk = "0.33.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
